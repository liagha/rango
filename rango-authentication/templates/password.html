{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block main %}
<h1>Change password</h1>
{% if done %}
<p class="done">Password changed.</p>
{% else %}
{% if !error.is_empty() %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
<input type="hidden" name="forgery" value="{{ token }}">
<label for="password-current">Current password</label>
<input id="password-current" name="current" type="password" autocomplete="current-password">
<label for="password-new">New password</label>
<input id="password-new" name="password" type="password" autocomplete="new-password">
<label for="password-confirm">Confirm new password</label>
<input id="password-confirm" name="confirm" type="password" autocomplete="new-password">
<button type="submit">Change password</button>
</form>
{% endif %}
{% endblock %}
