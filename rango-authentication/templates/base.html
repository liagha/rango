<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %}</title>
<script>try{if(localStorage.getItem("theme")==="light"){document.documentElement.dataset.theme="light"}}catch(e){}</script>
<style>
:root{--bg:#fff;--ink:#111;--muted:#666;--line:#e5e5e5;--fieldline:#ccc;--field:#fff;--strong:#111;--btn:#111;--btntext:#fff;--btnhover:#333;color-scheme:light}
[data-theme="dark"]{--bg:#141519;--ink:#e9e7e2;--muted:#a3a099;--line:#2b2e35;--fieldline:#3a3e46;--field:#1b1e24;--strong:#3f434c;--btn:#e9e7e2;--btntext:#141519;--btnhover:#c7c4bb;color-scheme:dark}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);margin:0;line-height:1.5}
main{max-width:24rem;margin:4rem auto;padding:0 1.5rem}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.02em;margin:0 0 1rem}
label{display:block;font-size:.8rem;font-weight:600;margin:.8rem 0 .25rem}
input,button{font:inherit;color:var(--ink)}
input{width:100%;border:1px solid var(--fieldline);border-radius:6px;padding:.45rem .6rem;background:var(--field)}
input:focus{outline:none;border-color:var(--strong)}
button{display:inline-block;background:var(--btn);color:var(--btntext);border:1px solid var(--btn);border-radius:6px;padding:.45rem 1rem;cursor:pointer;font-size:.9rem;margin-top:1rem;width:100%}
button:hover{background:var(--btnhover);border-color:var(--btnhover)}
.error{border:1px solid var(--strong);border-radius:6px;padding:.5rem .75rem;font-size:.9rem}
.done{border:1px solid var(--strong);border-radius:6px;padding:.5rem .75rem;font-size:.9rem}
.muted{color:var(--muted);font-size:.85rem}
@media (max-width:40rem){
main{margin:2rem auto;padding:0 1rem}
}
</style>
</head>
<body>
<main>
{% block main %}{% endblock %}
</main>
</body>
</html>
