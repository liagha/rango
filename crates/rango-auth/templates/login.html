{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block main %}
{% if let Some(name) = user %}
<h1>Logged in</h1>
<p class="muted">Signed in as {{ name }}.</p>
<form method="post" action="logout">
<input type="hidden" name="forgery" value="{{ token }}">
<button type="submit">Log out</button>
</form>
{% else %}
<h1>Login</h1>
{% if !error.is_empty() %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
<input type="hidden" name="forgery" value="{{ token }}">
<input type="hidden" name="next" value="{{ next }}">
<label for="login-username">Username</label>
<input id="login-username" name="username" type="text" value="{{ username }}" autocomplete="username">
<label for="login-password">Password</label>
<input id="login-password" name="password" type="password" autocomplete="current-password">
<button type="submit">Log in</button>
</form>
{% endif %}
{% endblock %}
