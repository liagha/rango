{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block main %}
<h1>Sign up</h1>
{% if !error.is_empty() %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
<input type="hidden" name="forgery" value="{{ token }}">
<label for="signup-username">Username</label>
<input id="signup-username" name="username" type="text" value="{{ username }}" autocomplete="username">
<label for="signup-password">Password</label>
<input id="signup-password" name="password" type="password" autocomplete="new-password">
<label for="signup-confirm">Confirm password</label>
<input id="signup-confirm" name="confirm" type="password" autocomplete="new-password">
<button type="submit">Create account</button>
</form>
<p class="muted"><a href="login">Log in</a> instead.</p>
{% endblock %}
