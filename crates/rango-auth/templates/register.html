<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#111;background:#fff;margin:0;line-height:1.5}
main{max-width:24rem;margin:4rem auto;padding:0 1.5rem}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.02em;margin:0 0 1rem}
label{display:block;font-size:.8rem;font-weight:600;margin:.8rem 0 .25rem}
input,button{font:inherit;color:#111}
input{width:100%;border:1px solid #ccc;border-radius:6px;padding:.45rem .6rem;background:#fff}
input:focus{outline:none;border-color:#111}
button{display:inline-block;background:#111;color:#fff;border:1px solid #111;border-radius:6px;padding:.45rem 1rem;cursor:pointer;font-size:.9rem;margin-top:1rem}
button:hover{background:#333;border-color:#333}
.error{border:1px solid #111;border-radius:6px;padding:.5rem .75rem;font-size:.9rem}
.muted{color:#666;font-size:.85rem}
</style>
</head>
<body>
<main>
<h1>Sign up</h1>
{% if !error.is_empty() %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
<input type="hidden" name="csrf" value="{{ token }}">
<label for="signup-username">Username</label>
<input id="signup-username" name="username" type="text" value="{{ username }}" autocomplete="username">
<label for="signup-password">Password</label>
<input id="signup-password" name="password" type="password" autocomplete="new-password">
<label for="signup-confirm">Confirm password</label>
<input id="signup-confirm" name="confirm" type="password" autocomplete="new-password">
<button type="submit">Create account</button>
</form>
<p class="muted"><a href="login">Log in</a> instead.</p>
</main>
</body>
</html>
