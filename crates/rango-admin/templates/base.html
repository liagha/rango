<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Admin{% endblock %}</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#111;background:#fff;margin:0;line-height:1.5}
a{color:#111}
.top{border-bottom:2px solid #111}
.top nav{max-width:62rem;margin:0 auto;padding:.8rem 1.5rem;font-size:.9rem}
.top nav a{text-decoration:none}
.top nav a:hover{text-decoration:underline}
main{max-width:62rem;margin:0 auto;padding:1.5rem}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.02em;margin:0 0 1rem}
h2{font-size:1.15rem;font-weight:650;margin:1.5rem 0 .5rem}
table{width:100%;border-collapse:collapse;font-size:.9rem;margin:1rem 0}
th,td{text-align:left;padding:.55rem .75rem;border-bottom:1px solid #e5e5e5;vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:#555;border-bottom:2px solid #111}
th a{color:inherit;text-decoration:none}
th a:hover{text-decoration:underline}
tbody tr:hover td{background:#f6f6f6}
input,select,button{font:inherit;color:#111}
input[type=text],input[type=search],input[type=number],select{border:1px solid #ccc;border-radius:6px;padding:.45rem .6rem;background:#fff}
input:focus,select:focus{outline:none;border-color:#111}
button,.btn{display:inline-block;background:#111;color:#fff;border:1px solid #111;border-radius:6px;padding:.45rem 1rem;text-decoration:none;cursor:pointer;font-size:.9rem}
button:hover,.btn:hover{background:#333;border-color:#333}
.ghost{background:#fff;color:#111}
.ghost:hover{background:#f0f0f0;border-color:#111}
.bar{display:flex;gap:.5rem;align-items:center;margin:1rem 0;flex-wrap:wrap}
.bar input[type=search]{flex:1;min-width:12rem}
.muted{color:#666;font-size:.85rem}
.errors{border:2px solid #111;border-radius:6px;padding:.6rem 1rem;margin:0 0 1rem}
.errors ul{margin:0;padding-left:1.2rem}
.pager{display:flex;gap:1rem;align-items:center;margin-top:1rem}
.pager a{text-decoration:none}
.pager a:hover{text-decoration:underline}
.field{margin:.8rem 0}
.field label{display:block;font-size:.8rem;font-weight:600;margin-bottom:.25rem}
.field input[type=text],.field input[type=number]{width:100%}
details{border:1px solid #e5e5e5;border-radius:6px;padding:.6rem .9rem;margin:1rem 0}
summary{cursor:pointer;font-weight:600;font-size:.9rem}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(10rem,1fr));gap:0 1rem}
.filters label{display:block;font-size:.8rem;font-weight:600;margin:.6rem 0 .25rem}
.filters input,.filters select{width:100%}
.actions{display:flex;gap:.75rem;margin-top:1rem;align-items:center}
.actions a{text-decoration:none}
.actions a:hover{text-decoration:underline}
</style>
</head>
<body>
<header class="top"><nav>{% block nav %}<strong>Admin</strong>{% endblock %}</nav></header>
<main>{% block main %}{% endblock %}</main>
</body>
</html>
