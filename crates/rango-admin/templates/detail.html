{% extends "base.html" %}
{% block title %}{{ title }} {{ id }} · Admin{% endblock %}
{% block nav %}<a href="../../">Admin</a> / <a href="../">{{ title }}</a> / {{ id }}{% endblock %}
{% block main %}
<h1>{{ title }} {{ id }}</h1>
<p class="actions"><a class="btn" href="edit/">Edit</a></p>
<table>
<tbody>
{% for pair in pairs %}
<tr><th>{{ pair.name }}</th><td>{{ pair.value }}</td></tr>
{% endfor %}
</tbody>
</table>
<form method="post" action="delete/">
<input type="hidden" name="csrf" value="{{ token }}">
<p class="actions"><button class="ghost" type="submit">Delete</button></p>
</form>
{% endblock %}
