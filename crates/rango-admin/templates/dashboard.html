<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Admin</title>
<style>body{font-family:sans-serif;max-width:40rem;margin:2rem auto}a{color:#06c}li{margin:.4rem 0}.count{color:#666}</style>
</head>
<body>
<h1>Admin</h1>
<ul>
{% for entry in entries %}
<li><a href="{{ entry.href }}">{{ entry.title }}</a> <span class="count">({{ entry.count }})</span></li>
{% endfor %}
</ul>
</body>
</html>
