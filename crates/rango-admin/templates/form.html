<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<style>body{font-family:sans-serif;max-width:40rem;margin:2rem auto}a{color:#06c}label{display:block;margin-top:1rem}input{width:100%;padding:.4rem}</style>
</head>
<body>
<h1>{{ title }}</h1>
<form method="post">
<input type="hidden" name="csrf" value="{{ token }}">
{% for input in inputs %}
<p>{{ input|safe }}</p>
{% endfor %}
<p><button type="submit">Save</button></p>
</form>
</body>
</html>
