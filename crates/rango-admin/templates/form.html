{% extends "base.html" %}
{% block title %}{{ title }} · Admin{% endblock %}
{% block nav %}<a href="{{ home }}">Admin</a> / <a href="{{ up }}">{{ model }}</a> / {{ sub }}{% endblock %}
{% block main %}
<h1>{{ title }}</h1>
<form method="post">
<input type="hidden" name="csrf" value="{{ token }}">
{% for input in inputs %}
<div class="field">{{ input|safe }}</div>
{% endfor %}
<p class="actions"><button type="submit">Save</button><a href="{{ up }}">Cancel</a></p>
</form>
{% endblock %}
